<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brostería El Padrino - Carta Digital</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0f0f11;
            color: #ffffff;
            padding-bottom: 100px;
        }

        header {
            background: linear-gradient(135deg, #e63946, #b8001f);
            padding: 20px 15px;
            text-align: center;
            border-bottom-left-radius: 20px;
            border-bottom-right-radius: 20px;
            box-shadow: 0 4px 15px rgba(230, 57, 70, 0.3);
            position: relative;
        }

        .brand-title {
            font-size: 26px;
            font-weight: 900;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .brand-subtitle {
            font-size: 13px;
            color: #ffccd5;
            margin-top: 4px;
            font-weight: 600;
        }

        .mesa-badge {
            display: inline-block;
            background-color: #000000;
            color: #ffb703;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
            margin-top: 10px;
            border: 1px solid #ffb703;
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
            padding: 15px;
        }

        .client-section {
            background: #1a1a1e;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 20px;
            border: 1px solid #2a2a30;
        }

        .client-section label {
            display: block;
            font-size: 13px;
            color: #aaa;
            margin-bottom: 6px;
        }

        .client-section input {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #333;
            background: #0f0f11;
            color: #fff;
            font-size: 15px;
            outline: none;
        }

        .client-section input:focus {
            border-color: #e63946;
        }

        .category-title {
            font-size: 18px;
            font-weight: 800;
            color: #ffb703;
            margin: 25px 0 12px 0;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 8px;
            border-bottom: 2px solid #2a2a30;
            padding-bottom: 6px;
        }

        .card {
            background: #1a1a1e;
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 12px;
            border: 1px solid #2a2a30;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .item-name {
            font-size: 16px;
            font-weight: 700;
        }

        .item-price {
            font-size: 16px;
            font-weight: 800;
            color: #ff334b;
        }

        .options-group {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 4px;
        }

        .option-btn {
            position: relative;
        }

        .option-btn input[type="radio"] {
            display: none;
        }

        .option-btn label {
            display: block;
            padding: 6px 12px;
            background: #26262c;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
            border: 1px solid transparent;
            transition: all 0.2s;
        }

        .option-btn input[type="radio"]:checked + label {
            background: #e63946;
            color: #fff;
            border-color: #ff6b6b;
            font-weight: bold;
        }

        .btn-add {
            background: #2a2a30;
            color: #fff;
            border: none;
            padding: 10px;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
            margin-top: 6px;
            transition: background 0.2s;
        }

        .btn-add:active {
            background: #e63946;
        }

        .cart-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #1a1a1e;
            padding: 15px;
            border-top: 2px solid #e63946;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 -5px 20px rgba(0,0,0,0.8);
            max-width: 500px;
            margin: 0 auto;
        }

        .total-info {
            display: flex;
            flex-direction: column;
        }

        .total-label {
            font-size: 12px;
            color: #aaa;
        }

        .total-amount {
            font-size: 20px;
            font-weight: 900;
            color: #ffb703;
        }

        .btn-order {
            background: #25d366;
            color: #fff;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 800;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-order:active {
            background: #1ebd56;
        }
    </style>
</head>
<body>

    <header>
        <div class="brand-title">BROSTERÍA EL PADRINO</div>
        <div class="brand-subtitle">&#128293; EL MEJOR SABOR Y CROCANCIA &#128293;</div>
        <div class="mesa-badge" id="displayMesa">MESA Nº 1</div>
    </header>

    <div class="container">

        <div class="client-section">
            <label for="nombreCliente">&#128104; TU NOMBRE:</label>
            <input type="text" id="nombreCliente" placeholder="Ej. Juan Pérez" autocomplete="off">
        </div>

        <!-- CATEGORÍA 1 -->
        <div class="category-title">&#127831; PIEZAS BROASTER</div>

        <div class="card">
            <div class="card-header">
                <span class="item-name">1 Pieza Broaster</span>
                <span class="item-price">S/ 10.00</span>
            </div>
            <div class="options-group">
                <div class="option-btn">
                    <input type="radio" id="p1_pecho" name="opt_p1" value="Pecho" checked>
                    <label for="p1_pecho">Pecho</label>
                </div>
                <div class="option-btn">
                    <input type="radio" id="p1_pierna" name="opt_p1" value="Pierna">
                    <label for="p1_pierna">Pierna</label>
                </div>
            </div>
            <button class="btn-add" onclick="agregarOpcion('1 Pieza Broaster', 10, 'opt_p1')">+ AGREGAR AL PEDIDO</button>
        </div>

        <div class="card">
            <div class="card-header">
                <span class="item-name">2 Piezas Broaster</span>
                <span class="item-price">S/ 18.00</span>
            </div>
            <div class="options-group">
                <div class="option-btn">
                    <input type="radio" id="p2_pecho" name="opt_p2" value="Pecho" checked>
                    <label for="p2_pecho">Pecho</label>
                </div>
                <div class="option-btn">
                    <input type="radio" id="p2_pierna" name="opt_p2" value="Pierna">
                    <label for="p2_pierna">Pierna</label>
                </div>
            </div>
            <button class="btn-add" onclick="agregarOpcion('2 Piezas Broaster', 18, 'opt_p2')">+ AGREGAR AL PEDIDO</button>
        </div>

        <!-- CATEGORÍA 2 -->
        <div class="category-title">&#127839; MOSTROS</div>

        <div class="card">
            <div class="card-header">
                <span class="item-name">Mostro (Chaufa + Papas + Pollo)</span>
                <span class="item-price">S/ 16.00</span>
            </div>
            <div class="options-group">
                <div class="option-btn">
                    <input type="radio" id="m1_pecho" name="opt_m1" value="Pecho" checked>
                    <label for="m1_pecho">Pecho</label>
                </div>
                <div class="option-btn">
                    <input type="radio" id="m1_pierna" name="opt_m1" value="Pierna">
                    <label for="m1_pierna">Pierna</label>
                </div>
            </div>
            <button class="btn-add" onclick="agregarOpcion('Mostro', 16, 'opt_m1')">+ AGREGAR AL PEDIDO</button>
        </div>

        <!-- CATEGORÍA 3 -->
        <div class="category-title">&#129380; BEBIDAS</div>

        <div class="card">
            <div class="card-header">
                <span class="item-name">Gaseosa 500ml</span>
                <span class="item-price">S/ 4.00</span>
            </div>
            <button class="btn-add" onclick="agregarDirecto('Gaseosa 500ml', 4)">+ AGREGAR AL PEDIDO</button>
        </div>

        <div class="card">
            <div class="card-header">
                <span class="item-name">Inca Kola 1.5L</span>
                <span class="item-price">S/ 10.00</span>
            </div>
            <button class="btn-add" onclick="agregarDirecto('Inca Kola 1.5L', 10)">+ AGREGAR AL PEDIDO</button>
        </div>

    </div>

    <!-- BARRA INFERIOR / CARRITO -->
    <div class="cart-bar">
        <div class="total-info">
            <span class="total-label">TOTAL ACUMULADO</span>
            <span class="total-amount" id="totalPrecio">S/ 0.00</span>
        </div>
        <button class="btn-order" onclick="enviarWhatsAppDirecto()">ENVIAR PEDIDO &#128640;</button>
    </div>

    <script>
        const MI_NUMERO_WHATSAPP = "51904375565"; 
        let numMesa = "1";
        let carrito = [];

        window.onload = function() {
            const urlParams = new URLSearchParams(window.location.search);
            const mesaParam = urlParams.get('mesa');
            if (mesaParam) {
                numMesa = mesaParam;
            }
            document.getElementById('displayMesa').innerText = `MESA Nº ${numMesa}`;
        };

        function agregarDirecto(nombre, precio) {
            carrito.push({ nombre, precio, detalle: "" });
            actualizarTotal();
        }

        function agregarOpcion(nombre, precio, radioName) {
            const opcion = document.querySelector(`input[name="${radioName}"]:checked`).value;
            carrito.push({ nombre, precio, detalle: opcion });
            actualizarTotal();
        }

        function actualizarTotal() {
            const total = carrito.reduce((sum, item) => sum + item.precio, 0);
            document.getElementById('totalPrecio').innerText = `S/ ${total.toFixed(2)}`;
        }

        function enviarWhatsAppDirecto() {
            const nombre = document.getElementById('nombreCliente').value.trim();

            if (!nombre) {
                alert("Por favor escribe tu nombre primero.");
                return;
            }

            if (carrito.length === 0) {
                alert("Selecciona al menos un producto.");
                return;
            }

            let total = 0;
            
            // Códigos Unicode (\u) para garantizar que los emojis no se corrompan en WhatsApp
            let lineas = [
                "\u{1F525} *BROSTER\u{00CD}A EL PADRINO* \u{1F525}",
                "━━━━━━━━━━━━━━━━━━━━━",
                "\u{1F424} *UBICACI\u{00D3}N:* MESA N\u{00BA} " + numMesa,
                "\u{1F464} *CLIENTE:* " + nombre.toUpperCase(),
                "━━━━━━━━━━━━━━━━━━━━━",
                "",
                "\u{1F4CB} *RESUMEN DE TU PEDIDO:*"
            ];

            carrito.forEach((item, index) => {
                let detalleTexto = item.detalle ? " _(" + item.detalle + ")_" : "";
                lineas.push("*" + (index + 1) + ".* " + item.nombre + detalleTexto);
                lineas.push("   └─ 💰 *S/ " + item.precio.toFixed(2) + "*");
                total += item.precio;
            });

            lineas.push("");
            lineas.push("━━━━━━━━━━━━━━━━━━━━━");
            lineas.push("\u{1F4B5} *TOTAL A PAGAR: S/ " + total.toFixed(2) + "*");
            lineas.push("━━━━━━━━━━━━━━━━━━━━━");
            lineas.push("");
            lineas.push("Por favor, env\u{00ED}ame el QR de Yape/Plin a este chat para realizar el pago de S/ " + total.toFixed(2) + " y confirmar mi pedido. \u{00A1Gracias! \u{1F64C}");

            let mensajeCompleto = lineas.join("\n");
            let urlWhatsApp = "https://wa.me/" + MI_NUMERO_WHATSAPP + "?text=" + encodeURIComponent(mensajeCompleto);

            window.location.href = urlWhatsApp;
        }
    </script>
</body>
</html>
